[package]
name = "memory-serve-test"
edition = "2024"

# Build with `--no-default-features` to try the gzip-only mode,
# without the brotli dependency.
[features]
default = ["brotli"]
brotli = ["memory-serve/brotli"]

[dependencies]
memory-serve = { path = "../", default-features = false }
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = "0.3"
tracing = "0.1"

[build-dependencies]
memory-serve = { path = "../", default-features = false }
